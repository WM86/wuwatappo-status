name: probe

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "probe/**"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run probe
        run: python3 probe/probe.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "probe: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
