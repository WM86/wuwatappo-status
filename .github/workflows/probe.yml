name: probe

on:
  schedule:
    # 半小时叫一次，但一次任务里自己连探 6 轮（每 5 分钟一轮，覆盖 25 分钟）。
    # GitHub 的 schedule 本身不守时，靠 job 内部循环把延迟摊薄，少一次调度也不至于断档。
    - cron: "*/30 * * * *"
  push:
    paths:
      - "probe/**"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Probe loop
        run: |
          for i in 1 2 3 4 5 6; do
            echo "== round $i =="
            python3 probe/probe.py || true
            git add data/history.json
            if git diff --cached --quiet; then
              echo "no change"
            else
              git commit -m "probe: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git pull --rebase --autostash origin master || true
              git push || true
            fi
            if [ "$i" != "6" ]; then sleep 300; fi
          done
